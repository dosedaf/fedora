[app-folders]
folder-children=['System', 'Utilities', 'YaST', 'Pardus']

[app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[app-folders/folders/System]
apps=['org.gnome.baobab.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.Logs.desktop', 'org.freedesktop.MalcontentControl.desktop', 'org.freedesktop.GnomeAbrt.desktop', 'org.gnome.SystemMonitor.desktop']
name='X-GNOME-Shell-System.directory'
translate=true

[app-folders/folders/Utilities]
apps=['org.gnome.Decibels.desktop', 'org.gnome.Connections.desktop', 'org.gnome.Papers.desktop', 'org.gnome.font-viewer.desktop', 'org.gnome.Loupe.desktop']
name='X-GNOME-Shell-Utilities.directory'
translate=true

[app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[background]
picture-options='zoom'
picture-uri='file:///home/yoda/.config/background'
picture-uri-dark='file:///home/yoda/.config/background'

[break-reminders]
selected-breaks=@as []

[break-reminders/eyesight]
play-sound=false

[break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=false

[input-sources]
current=uint32 0
sources=[('xkb', 'us')]

[interface]
color-scheme='prefer-dark'
show-battery-percentage=false
toolkit-accessibility=false

[notifications]
application-children=['org-gnome-software', 'org-mozilla-firefox', 'org-gnome-ptyxis', 'code', 'gnome-about-panel', 'gnome-power-panel', 'org-qbittorrent-qbittorrent', 'org-freedesktop-problems-applet', 'org-gnome-nautilus', 'gnome-wellbeing-panel', 'org-gnome-showtime', 'org-kde-kdenlive', 'org-shotcut-shotcut', 'com-usebottles-bottles-devel', 'org-gnome-decibels', 'com-github-persepolisdm-persepolis', 'org-winehq-wine', 'heroic', 'brave-browser', 'discord', 'zoom', 'wine-notepad', 'vlc', 'steam', 'org-gnome-systemmonitor', 'zen', 'org-gnome-texteditor', 'org-gnome-characters', 'libreoffice-writer', 'virtualbox', 'libreoffice-calc', 'waydroid-com-android-vending', 'waydroid-com-instagram-android', 'org-freedesktop-gnomeabrt', 'wine-uninstaller', 'com-obsproject-studio', 'docker-desktop', 'zapfast', 'ai-opencode-desktop', 'org-gnome-clocks', 'md-obsidian-obsidian', 'io-github-yapfast-yapfast', 'gnome-printers-panel', 'mixmusic', 'ardia']

