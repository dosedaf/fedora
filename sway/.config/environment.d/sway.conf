# sway / wlroots environment for the hybrid GPU (Intel iGPU + RTX 3050).
# Stowed from ~/fedora -> ~/.config/environment.d/sway.conf
#
# Read by the systemd user manager, so it applies to a GDM-launched sway
# session. GNOME ignores all of these.
#
# NOTE: there is deliberately no WLR_DRM_DEVICES here. The /dev/dri/by-path
# names contain colons (pci-0000:00:02.0-card) and wlroots splits the list on
# colons, so the device list is resolved at launch time by
# ~/.local/bin/sway-hybrid instead of hard-coding /dev/dri/cardN, which moves
# between boots.
#
# NOTE: SWAY_UNSUPPORTED_GPU (the env equivalent of --unsupported-gpu) does not
# exist in sway 1.11 -- it lands in 1.12. Until Fedora ships that, the wrapper
# must pass the flag.

# nvidia has no working hardware cursor path under wlroots
WLR_NO_HARDWARE_CURSORS=1
