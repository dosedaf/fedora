# sway / wlroots environment for the hybrid GPU (Intel iGPU + RTX 3050).
# Stowed from ~/fedora -> ~/.config/environment.d/sway.conf
#
# Read by the systemd user manager, so it applies to a GDM-launched sway
# session. GNOME ignores all of these.
#
# The nvidia card registers after the Intel one, and card numbering is not
# stable across boots -- so refer to the devices by PCI path.
#   00:02.0 = Intel Iris Xe   (laptop panel, primary renderer)
#   01:00.0 = RTX 3050        (HDMI-A-1 output)
# To go Intel-only later: delete everything after the colon.
WLR_DRM_DEVICES=/dev/dri/by-path/pci-0000:00:02.0-card:/dev/dri/by-path/pci-0000:01:00.0-card

# silence sway's "unsupported GPU" nag (nvidia is expected here)
SWAY_UNSUPPORTED_GPU=true

# nvidia has no working hardware cursor path under wlroots
WLR_NO_HARDWARE_CURSORS=1
